[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prediction-markets-api"
version = "0.1.0"
description = "Unified Python client for prediction markets (Polymarket, Kalshi, Limitless)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Prediction Markets API Contributors"}
]
keywords = ["prediction markets", "polymarket", "kalshi", "limitless", "trading", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "httpx>=0.27.0",
    "python-dateutil>=2.8.2",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "respx>=0.21.0",
    "types-python-dateutil>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/prediction-markets-api/prediction-markets-api"
Repository = "https://github.com/prediction-markets-api/prediction-markets-api"
Issues = "https://github.com/prediction-markets-api/prediction-markets-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_markets_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: marks tests that require live API access (deselect with '-m \"not live\"')",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["prediction_markets_api"]
